name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install project dependencies
        run: |
          poetry check --lock
          poetry install --with dev --no-interaction

      - name: Check formatting
        run: poetry run black --check src tests

      - name: Check lint
        run: poetry run flake8 src tests

      - name: Validate pre-commit configuration
        run: poetry run pre-commit validate-config

      - name: Run tests
        run: poetry run pytest -q

      - name: Build Docker image
        run: docker build -t cirrhosis-outcome-service:ci .

      - name: Check container API
        run: |
          docker run -d --name cirrhosis-ci -p 127.0.0.1:8000:8000 cirrhosis-outcome-service:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 60 --max-time 5 http://127.0.0.1:8000/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/predict -H "Content-Type: application/json" --data-binary @examples/predict_request.json

      - name: Show container logs on failure
        if: failure()
        run: docker logs cirrhosis-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f cirrhosis-ci || true
